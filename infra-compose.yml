services:
  # ==========================================
  # 1. MONITORING & OBSERVABILITY TIER
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: gym-grafana
    restart: always
    ports:
      # VERY IMPORTANT: Grafana is accessible ONLY via Tailscale VPN!
      - "100.73.51.58:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./data/grafana:/var/lib/grafana               
      - ./grafana/provisioning:/etc/grafana/provisioning
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - gym_monitor_net

  prometheus:
    image: prom/prometheus:latest
    container_name: gym-prometheus
    restart: always
    # Uncomment the 2 lines below if you want direct access to Prometheus (also only via VPN)
    # ports:
    #   - "100.73.51.58:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus                 
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - gym_monitor_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gym-cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    privileged: true
    networks:
      - gym_monitor_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: gym-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - gym_monitor_net

  loki:
    image: grafana/loki:latest
    container_name: gym-loki
    restart: always
    networks:
      - gym_monitor_net

  alloy:
    image: grafana/alloy:latest
    container_name: gym-alloy
    restart: always
    user: root
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - gym_monitor_net

  # If you keep Cloudflare Tunnel in infra-compose, you can add it here, e.g.:
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflare-tunnel
  #   command: tunnel run --token YOUR_TOKEN_HERE
  #   restart: unless-stopped
  #   networks:
  #     - cloudflare_net

networks:
  gym_monitor_net:
    name: gym_monitor_net
    driver: bridge
  # If you uncomment cloudflared above, also add the network definition:
  # cloudflare_net:
  #   external: true