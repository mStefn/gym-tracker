name: Manual App Teardown

on:
  workflow_dispatch:

jobs:
  teardown-app:
    runs-on: ubuntu-22.04

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Stop Application Stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }} || {
              echo "❌ Error: Project directory not found!"
              exit 1
            }

            echo "🛑 Stopping Gym Tracker..."
            docker compose -f app-compose.yml -p gym-app down

            echo "✅ Application stack stopped."

  notify:
    needs: [teardown-app]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.teardown-app.result }}
          title: "🛑 Gym Tracker Teardown Report"
          description: |
            **Application Teardown:** ${{ needs.teardown-app.result }}

            Gym Tracker application stack has been stopped.

            Check details here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
