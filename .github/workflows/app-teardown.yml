name: Manual App Teardown (No Infra)

on:
  workflow_dispatch: 

jobs:
  # ==========================================
  # STEP 1: TEARDOWN APP
  # ==========================================
  teardown-app:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Stop Application Stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            echo "Stopping Application containers..."
            docker compose -f app-compose.yml -p gym-app down

  # ==========================================
  # STEP 2: DISCORD NOTIFICATION
  # ==========================================
  notify:
    needs: [teardown-app]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}          
          status: ${{ needs.teardown-app.result }}
          title: "🛑 Manual App Teardown Report (No Infra)"
          description: |
            **1. App Teardown:** ${{ needs.teardown-app.result }}
            
            Aplikacja (Frontend, Backend, DB) została zatrzymana. 
            Infrastruktura (Monitoring, SonarQube) nadal działa w tle.
            
            Check details here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
