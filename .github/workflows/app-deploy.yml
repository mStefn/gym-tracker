name: Deploy App (Auto CI/CD)

on:
  push:
    branches: [ main ]
    # Ignore infrastructure files to prevent triggering app builds on monitoring updates
    paths-ignore:
      - 'infra-compose.yml'
      - 'prometheus.yml'
      - 'grafana/**'
      - 'alloy/**'
      - 'README.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/mstefn/gym-backend
  IMAGE_NAME_FRONTEND: ghcr.io/mstefn/gym-frontend  

jobs:
  # ==========================================
  # STEP 1: BUILD & PUSH APP
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set Image Tag
        run: echo "APP_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.IMAGE_NAME_BACKEND }}:${{ env.APP_TAG }}
          
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.IMAGE_NAME_FRONTEND }}:${{ env.APP_TAG }}

  # ==========================================
  # STEP 2: DEPLOY APP ON SERVER
  # ==========================================
  deploy-app:
    needs: build-and-push
    runs-on: ubuntu-22.04
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy App to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }} || { echo "❌ Error: Project directory not found!"; exit 1; }
            
            git pull origin main
            
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # ZMIANA TUTAJ: Eksportujemy zmienną do pamięci, zamiast kasować plik .env
            export APP_VERSION=sha-${GITHUB_SHA::7}
            
            docker compose -f app-compose.yml pull
            docker compose -f app-compose.yml -p gym-app up -d --remove-orphans
            
            # Global cleanup of unused/dangling images
            docker image prune -af

  # ==========================================
  # STEP 3: APP HEALTH CHECK
  # ==========================================
  health-check-app:
    needs: deploy-app
    runs-on: ubuntu-22.04
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Backend Health
        run: |
          echo "Waiting for app to start (up to 60 seconds)..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gym.m-stefn.com.pl/api/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Backend is Healthy!"
              exit 0
            fi
            echo "Attempt $i/12: App returned $STATUS. Waiting 5 seconds..."
            sleep 5
          done
          echo "❌ Error: Backend did not start in time!"
          exit 1

  # ==========================================
  # STEP 4: DISCORD NOTIFICATION
  # ==========================================
  notify:
    needs: [build-and-push, deploy-app, health-check-app]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}          
          status: ${{ (needs.build-and-push.result == 'success' && needs.health-check-app.result == 'success') && 'success' || 'failure' }}
          title: "🚀 Application Auto-Deployment Report"
          description: |
            **1. Build & Push:** ${{ needs.build-and-push.result }}
            **2. Server Deploy:** ${{ needs.deploy-app.result }}
            **3. App Health Check:** ${{ needs.health-check-app.result }}
            
            The latest changes to the main branch have been deployed.
            Check details here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
