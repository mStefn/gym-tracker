services:
  db:
    image: postgres:16
    container_name: gym-test-db
    restart: unless-stopped
    env_file: .env.test
    volumes:
      - gym_test_db_data:/var/lib/postgresql/data  
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gym_test_net

  backend:
    image: gym-backend:test
    container_name: gym-test-backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file: .env.test
    depends_on:
      - db
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gym_test_net

  frontend:
    image: gym-frontend:test
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gym-test-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - gym_test_net

volumes:
  gym_test_db_data:
    name: gym_test_db_data

networks:
  gym_test_net:
    name: gym_test_net
