services:
  db:
    image: postgres:16
    restart: always
    env_file: .env
    volumes:
      - gym_db_data:/var/lib/postgresql/data  
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gym_app_net

  backend:
    image: ghcr.io/mstefn/gym-backend:${APP_VERSION:-latest}
    restart: always
    expose:
      - "4000"
    env_file: .env
    environment:
      - DB_DSN=${DB_DSN}
      - AUTH_SECRET=${AUTH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - db
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gym_app_net

  frontend:
    image: ghcr.io/mstefn/gym-frontend:${APP_VERSION:-latest}
    restart: always
    expose:
      - "80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
    networks:
      - gym_app_net
      - cloudflare_net


volumes:
  gym_db_data:
    name: gym_db_data

networks:
  gym_app_net:
    external: true
    name: gym_app_net

  cloudflare_net:
    external: true
    name: cloudflare_net