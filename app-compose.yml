services:
  db:
    image: mariadb:10.11
    restart: always
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gym_app_net

  backend:
    image: ghcr.io/mstefn/gym-backend:${APP_VERSION:-latest}
    restart: always
    expose:
      - "4000"
    env_file: .env
    environment:
      - DB_DSN=${DB_DSN}
      - AUTH_SECRET=${AUTH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - db
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gym_app_net

  frontend:
    image: ghcr.io/mstefn/gym-frontend:${APP_VERSION:-latest}
    restart: always
    expose:
      - "80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
    networks:
      - gym_app_net
      - cloudflare_net

networks:
  gym_app_net:
    external: true
    name: gym_app_net

  cloudflare_net:
    external: true
    name: cloudflare_net